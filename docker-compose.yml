version: '3.8'

services:
  overtime-report:
    build: .
    container_name: overtime-report-app
    restart: always
    env_file:
      - .env
    ports:
      - "5030:5030"
    volumes:
      - .:/app
    command: gunicorn --workers 2 --reload --bind 0.0.0.0:5030 app:app
    networks:
      - centralnet

networks:
  centralnet:
    external: true
